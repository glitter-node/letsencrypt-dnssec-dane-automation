CERT_CONFIG_DIR="${CERT_CONFIG_DIR:-/etc/letsencrypt}"
CERT_WORK_DIR="${CERT_WORK_DIR:-/var/lib/letsencrypt}"
CERT_LOG_DIR="${CERT_LOG_DIR:-/var/log/letsencrypt}"

CERT_NAMES=(
  "DNSSEC-DNS1"
  "DNSSEC-DNS2"
  "DNS1"
  "DNS2"
  "DNS3"
)

declare -A DNSSEC_ENABLED=(
  [DNSSEC-DNS1]=true
  [DNSSEC-DNS2]=true
  [DNS1]=false
  [DNS2]=false
  [DNS3]=false
)

declare -A DANE_ENABLED=(
  [DNSSEC-DNS1]=true
  [DNSSEC-DNS2]=false
  [DNS1]=false
  [DNS2]=false
  [DNS3]=false
)

declare -A DNS_ZONE_MAP=(
  [app.example.com]="example.com"
  [www.example.com]="example.com"
  [mail.example.net]="example.net"
)

declare -A DNSSEC_ZONE_ENABLED=(

  [example.com]=true

  [example.net]=false

)
